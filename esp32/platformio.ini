; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = atoms3r_bno055

[env:atoms3r_bno055]
platform = espressif32@^6.8.1
platform_packages = 
	platformio/framework-arduinoespressif32@^3.20017.0
	platformio/tool-esptoolpy@1.40501.0
framework = arduino
board = m5stack-atoms3
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
data_dir = esp32/data
monitor_speed = 115200
; PlatformIO Project Configuration File
monitor_rts = 0
monitor_dtr = 0
upload_speed = 1500000
build_type = debug
build_flags = 
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ESP32S3
	-D ARUDINO_M5STACK_ATOMS3R
	-D BOARD_HAS_PSRAM
	-D USE_M5UNIFIED
	-D USE_FASTLED
	-D CORE_DEBUG_LEVEL=4
	-D DEBUG
	-D IMU_SENSOR_BNO055
	-fpermissive
	-D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-std=c++14
	-I src/boards
	-I test
lib_deps = 
	SPI
	Wire
	WiFi
	m5stack/M5Unified
	m5stack/M5GFX
	fastled/FastLED
	adafruit/Adafruit BusIO@^1.16.1
	adafruit/Adafruit Unified Sensor@^1.1.14
	adafruit/Adafruit GFX Library@^1.11.10
	hpsaturn/EspNowCam@^0.1.14
	tobozo/ESP32-PSRamFS@^1.0.6
	bodmer/TJpg_Decoder
	marvinroger/AsyncMqttClient
	esp32async/ESPAsyncWebServer@^3.7.3
	esp32async/AsyncTCP
	ayushsharma82/ElegantOTA@^3.1.2
	bblanchon/ArduinoJson@^6.21.3
	adafruit/Adafruit BNO055@^1.6.4
	throwtheswitch/Unity@^2.6.0
lib_ldf_mode = deep
upload_port = /dev/ttyACM0
test_build_src = true
test_port = /dev/ttyACM0
test_filter = test_device

[env:native]
platform = native
test_framework = unity
build_flags = -I test/mocks -std=c++11 -D NATIVE_ENV
test_build_src = true
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3

[env:device_test_native]
platform = native
test_framework = unity
build_flags = -I test/mocks -I src -I src/boards -D USE_M5ATOMS3R -std=c++11 -D NATIVE_ENV
test_build_src = true
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    fastled/FastLED
    src # Treat src/ as a local library
