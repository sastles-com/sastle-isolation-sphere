; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = atoms3r

[env:atoms3r]
platform = espressif32@^6.8.1
platform_packages = 
	platformio/framework-arduinoespressif32@^3.20017.0
	platformio/tool-esptoolpy@1.40501.0
framework = arduino
board = m5stack-atoms3
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
; PlatformIO Project Configuration File
monitor_rts = 0
monitor_dtr = 0
upload_speed = 115200
build_type = debug
build_src_filter = +<*> -<led_drive_test/>
build_flags =
	-D BOARD_M5ATOMS3R
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ESP32S3
	-D ARUDINO_M5STACK_ATOMS3R
	-D BOARD_HAS_PSRAM
	-D CORE_DEBUG_LEVEL=4
	-D DEBUG
	-D IMU_SENSOR_BNO055
	-fpermissive
	-std=c++14
	-I src/boards
lib_deps =
	; Core libraries
	Wire
	WiFi
	
	; Network & MQTT
	knolleary/PubSubClient@^2.8
	
	; JSON configuration
	bblanchon/ArduinoJson@^6.21.3
	
	; Image processing
	bodmer/TJpg_Decoder@^1.0.8
	
	; LED control
	fastled/FastLED@^3.7.8
	
	; LCD display
	m5stack/M5Unified@^0.2.3
	
	; IMU sensor
	adafruit/Adafruit BNO055@^1.6.4
	adafruit/Adafruit Unified Sensor@^1.1.14
	adafruit/Adafruit BusIO@^1.16.1
lib_ldf_mode = deep
upload_port = /dev/ttyACM0

; XIAO ESP32S3 ビルド。本体ファームを XIAO 向けにビルド/書き込みする。
; ピン等のハード差分は src/boards/board_xiao_esp32s3.h に集約 (LCD/ブザー無効)。
; 使い方: pio run -e xiao_esp32s3 [-t upload]
; upload_port は固定せず自動検出 (M5 と同時接続時の取り違え防止)。
[env:xiao_esp32s3]
platform = espressif32@^6.8.1
platform_packages =
	platformio/framework-arduinoespressif32@^3.20017.0
	platformio/tool-esptoolpy@1.40501.0
framework = arduino
board = seeed_xiao_esp32s3
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 115200
build_type = debug
build_src_filter = +<*> -<led_drive_test/>
build_flags =
	-D BOARD_XIAO_ESP32S3
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ESP32S3
	-D BOARD_HAS_PSRAM
	-D CORE_DEBUG_LEVEL=4
	-D DEBUG
	-D IMU_SENSOR_BNO055
	-fpermissive
	-std=c++14
	-I src/boards
lib_deps =
	; Core libraries
	Wire
	WiFi
	; Network & MQTT
	knolleary/PubSubClient@^2.8
	; JSON configuration
	bblanchon/ArduinoJson@^6.21.3
	; Image processing
	bodmer/TJpg_Decoder@^1.0.8
	; LED control
	fastled/FastLED@^3.7.8
	; IMU sensor (M5Unified は XIAO に LCD が無いため不要)
	adafruit/Adafruit BNO055@^1.6.4
	adafruit/Adafruit Unified Sensor@^1.1.14
	adafruit/Adafruit BusIO@^1.16.1
lib_ldf_mode = deep

; V2ハードウェア検証: M5AtomS3R で 5ストリップ×160 LED を駆動できるかのベンチテスト。
; 使い方: pio run -e led_drive_test -t upload
; ピン上書き例: build_flags に -D LED_TEST_PIN4=39 等を追加
[env:led_drive_test]
platform = espressif32@^6.8.1
platform_packages =
	platformio/framework-arduinoespressif32@^3.20017.0
	platformio/tool-esptoolpy@1.40501.0
framework = arduino
board = m5stack-atoms3
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 115200
build_src_filter = -<*> +<led_drive_test/>
build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ESP32S3
	-D BOARD_HAS_PSRAM
	-std=c++14
lib_deps =
	fastled/FastLED@^3.7.8
	m5stack/M5Unified@^0.2.3

[env:native]
platform = native
test_framework = unity
build_flags = -I test/mocks -std=c++11 -D NATIVE_ENV
test_build_src = true
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3

[env:device_test_native]
platform = native
test_framework = unity
build_flags = -I test/mocks -I src -I src/boards -D BOARD_M5ATOMS3R -D USE_M5ATOMS3R -std=c++11 -D NATIVE_ENV
test_build_src = true
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    fastled/FastLED
    src # Treat src/ as a local library
