[project]
name = "isolation-sphere-server"
version = "0.1.0"
description = "Control server for Isolation Sphere"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "evdev>=1.7.0 ; sys_platform == 'linux'",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "paho-mqtt>=2.0.0",
    "pillow>=10.0.0",  # scripts/stream_to_sphere.py の映像→JPEG変換
]

# 動画ファイルをストリームする場合のみ必要 (テストパターン/静止画は不要):
#   uv pip install opencv-python-headless

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "joystick"]
