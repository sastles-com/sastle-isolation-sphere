[project]
name = "isolation-sphere-server"
version = "0.1.0"
description = "Control server for Isolation Sphere"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "evdev>=1.7.0 ; sys_platform == 'linux'",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "paho-mqtt>=2.0.0",
    "pillow>=10.0.0",            # 映像→JPEG変換
    "python-multipart>=0.0.9",   # 動画アップロード (UploadFile/Form) に必須
    "opencv-python-headless>=4.8.0",  # 動画メタデータ抽出・フレームデコード(再生)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "joystick"]
